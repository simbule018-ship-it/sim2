<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
         background-color: rgb(139, 223, 43);
     }

body {
    margin: 0;
    padding: 0;
    background-color: #FDFBD4 ;
     }

  /*Slider container*/
  .slider-container {
    width: 80%;
    max-width: 900px;
    height: 400px;
    margin: 20px auto 0;
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  .slide img {
   width: 100%;
    height: 150%;
    object-fit: cover;
  }

  .slide.active {
    opacity: 1;
  }

  /* Navigation dots */
  .dots {
    text-align: center;
    position: absolute;
    width: 100%;
    bottom: 10px;
  }

  .dot {
    height: 12px;
    width: 12px;
    margin: 0 4px;
    display: inline-block;
    border-radius: 50%;
    background: #bbb;
    cursor: pointer;
  }

  .dot.active {
    background: #333;
  }

  .moving{              
      width: 100%;
  overflow: hidden;
  /*white-space: nowrp;*/
  white-space: nowrap;
  box-sizing: border-box;
  border: 1px solid;
  padding: 0.05%;
  background-color: rgb(91, 159, 236);
}
.moving span{
    display: inline-block;
  padding-left: 10%;
  animation: word 30s linear infinite;
  
}
@keyframes word{
    0%{
      transform: translateX(100vw);
    } 
    100%{
      transform: translateX(-100%)
    }}
a{
    text-decoration: none;
     box-shadow: 0 14px 14px rgba(23, 24, 23, 0.753);
     color: black;
     background-color: rgb(219, 219, 240);
     padding-left: 7px;
     padding-right: 7px;
     border-radius: 12px;
}
</style>
</head>
<body>

  </div>
  <div class="slide">
    <img src="pictures/D3.jpg"width="20%" height="30%" alt="Slide 3">
  </div>
  <div class="dots"></div>
</div><br>

<script>
  const slides = document.querySelectorAll('.slide');
  const dotsContainer = document.querySelector('.dots');

  let index = 0;

  // Create dots
  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    dot.classList.add('dot');
    if (i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => {
      index = i;
      updateSlider();
    });
    dotsContainer.appendChild(dot);
  });

  const dots = document.querySelectorAll('.dot');

  function updateSlider() {
    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active'));

    slides[index].classList.add('active');
    dots[index].classList.add('active');
  }

  function autoSlide() {
    index = (index + 1) % slides.length;
    updateSlider();
  }

  setInterval(autoSlide, 3000); // Change every 3 seconds
</script>
