<style>
  .image-container {
      width: 600px;
      height: 600px;
      margin: auto;
      overflow: hidden;
    }
    .image-container img {
      width: 70%;
      height: 70%;
      object-fit: cover; /* keeps images looking normal */
      border-radius: 12px;
    }

.wigo{
    width: 100%;
  overflow: hidden;
  /*white-space: nowrp;*/
  white-space: nowrap;
  box-sizing: border-box;
  border: 1px solid;
  padding: 0.05%;
  background-color: rgb(66, 182, 12);
}
   .wigo span{
    display: inline-block;
  padding-left: 10%;
  animation: name 30s linear infinite;
   }     
   @keyframes name {
    0%{
        transform: translateX(100vw);
    }
    100%{
        transform: translateX(-100%);
    }
}

   

</style>
<body>
    <div class="image-container">

    </div>

    <div class="wigo">
        <span>This is Lewis Musumya he is studying diploma in Clinical Medicine  and in 2025 he is his first year he is going to finish in 2027 </span>
    </div>
    
       <script>
     const images = ["pictures/L1.jpg","pictures/L2.jpg", "pictures/L3.jpg","pictures/L4.jpg"];
    let index = 0;

    function changeImage() {
      index = (index + 1) % images.length;
      document.getElementById("changingImage").src = images[index];
    }

    setInterval(changeImage, 3000); // changes every 3 seconds
   
  </script>
